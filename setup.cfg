[metadata]
name = chessvision
version = 0.0.1
author = Gudbrand Tandberg
author_email = gudbrandduff@gmail.com
description = Chessvision package

[options]
include_package_data = True
packages = 
    chessvision
    chessvision.data_processing
    chessvision.model
python_requires = >=3.8
install_requires =
    opencv-python>=4.8.0
    tensorflow>=2.8,<2.17
    python-chess
    matplotlib
    protobuf>=3.20.1,<5.0

[options.packages.find]
include = chessvision
